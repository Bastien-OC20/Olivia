<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Page locale, sans script externe ni ressource réseau. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Olivia</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0f1115; color: #e6e8ee;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .carte { max-width: 460px; padding: 32px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; background: #fff; padding: 4px; }
    h1 { margin: 16px 0 4px; font-size: 26px; }
    p { margin: 8px 0; color: #a3a9b8; }
    .roue {
      width: 28px; height: 28px; margin: 22px auto 0;
      border: 3px solid #2a2f3a; border-top-color: #6366f1; border-radius: 50%;
      animation: tour 0.9s linear infinite;
    }
    @keyframes tour { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .roue { animation: none; } }
    .erreur {
      margin-top: 20px; padding: 12px 14px; text-align: left;
      background: rgba(239, 68, 68, 0.12); border: 1px solid #ef4444; border-radius: 8px;
      color: #e6e8ee;
    }
    code { font-size: 12px; word-break: break-all; color: #c7cbd6; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="carte">
    <img src="icons/fenetre.png" alt="">
    <h1>Olivia</h1>
    <section id="attente" aria-live="polite">
      <p>Olivia démarre…</p>
      <p>Le premier lancement peut prendre une minute.</p>
      <div class="roue" role="progressbar" aria-label="Démarrage en cours"></div>
    </section>
    <section id="echec" class="erreur" role="alert" hidden>
      <strong>Olivia n'a pas pu démarrer.</strong>
      <p id="message"></p>
      <p>Essayez « Redémarrer Olivia » depuis son icône (barre des menus ou zone de
        notification). Si le problème persiste, transmettez ce journal au service
        informatique :</p>
      <p><code id="journal"></code></p>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search)
    if (params.has('erreur')) {
      document.getElementById('attente').hidden = true
      document.getElementById('echec').hidden = false
      document.getElementById('message').textContent = params.get('erreur')
      document.getElementById('journal').textContent = params.get('journal') || ''
    }
  </script>
</body>
</html>
