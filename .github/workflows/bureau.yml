# Construit l'application de bureau Olivia (desktop/) pour macOS et Windows.
#
# Pourquoi une CI : rien ne se compile « en croisé ». Le backend PyInstaller et
# l'installeur electron-builder se construisent chacun sur leur propre système :
# un .dmg sur un Mac, un .exe sur un Windows.
#
# Déclenchement :
#   - manuel (onglet Actions > « Application de bureau » > Run workflow) :
#     installeurs téléchargeables dans les artefacts du run ; case « publier »
#     cochée, ils sont joints en plus à une release brouillon v<version>
#     (version lue dans desktop/package.json) — pas besoin de pousser une
#     étiquette ;
#   - étiquette v* (ex. v1.1.0) : même publication.
#   La release est créée en BROUILLON, une seule fois, avant les deux
#   constructions (tâche « release ») : lancées en parallèle, elles en
#   créeraient sinon chacune une. Elle se publie à la main (Releases > Publish
#   release), ce qui crée l'étiquette si elle n'existe pas ; publiée, elle
#   devient la source des mises à jour automatiques.
#
# Les installeurs ne sont PAS signés (CSC_IDENTITY_AUTO_DISCOVERY=false) : voir
# le README, section « Application de bureau ». Les moteurs (Ollama, Tesseract)
# et les modèles d'IA ne sont pas embarqués ici : l'application utilise ceux
# installés sur le poste.
name: Application de bureau

on:
  workflow_dispatch:
    inputs:
      publier:
        description: "Joindre les installeurs à une release brouillon (version de desktop/package.json)"
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publier
    runs-on: ubuntu-latest
    outputs:
      etiquette: ${{ steps.version.outputs.etiquette }}
    steps:
      - uses: actions/checkout@v4

      - name: Version de l'application
        id: version
        run: echo "etiquette=v$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Release brouillon (créée une seule fois)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETIQUETTE: ${{ steps.version.outputs.etiquette }}
        run: |
          if gh release view "$ETIQUETTE" >/dev/null 2>&1; then
            echo "La release $ETIQUETTE existe déjà : les installeurs y seront joints."
          else
            gh release create "$ETIQUETTE" --draft --target "$GITHUB_SHA" \
              --title "Oliv'IA ${ETIQUETTE#v}" \
              --notes "Installeurs non signés : voir le README, section « Application de bureau »."
          fi

  construire:
    needs: release
    # Construit aussi quand « release » est sautée (run sans publication).
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest = Apple Silicon (arm64). Un Mac Intel demande un build
          # x64, sur un Mac Intel ou un runner Intel : non couvert ici.
          - os: macos-latest
            cible: --mac
          - os: windows-latest
            cible: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller pytest

      - name: Tests du backend
        run: python -m pytest tests -q

      - name: Interface (Vue)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend compilé (PyInstaller)
        run: pyinstaller build.spec --clean --noconfirm

      - name: Application de bureau (Electron)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          npm ci
          npm test
          node scripts/preparer.mjs
          if [[ -n "${{ needs.release.outputs.etiquette }}" ]]; then PUBLIER=always; else PUBLIER=never; fi
          npx electron-builder ${{ matrix.cible }} --publish "$PUBLIER"

      - uses: actions/upload-artifact@v4
        with:
          name: olivia-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/latest*.yml
          if-no-files-found: error
