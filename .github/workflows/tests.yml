# Tests d'Olivia sur chaque pull request et chaque push sur main.
#
# Pourquoi : jusqu'ici, le seul workflow (bureau.yml) ne tournait qu'à la main
# ou sur une étiquette v* — une PR pouvait casser le backend, l'interface ou
# l'application de bureau sans que personne ne le voie avant la construction
# des installeurs.
#
# Trois tâches indépendantes, rapides, sans rien construire de lourd :
#   - backend   : flake8 + pytest, sur les versions de Python annoncées par
#                 backend/requirements.txt (Linux), et sur Windows et macOS
#                 avec la version utilisée par bureau.yml — c'est là que les
#                 installeurs sont construits, autant y voir les tests passer ;
#   - interface : ESLint + tests Node des fonctions pures de l'interface + build Vite ;
#   - bureau    : tests Node des fonctions pures de desktop/ (sans télécharger
#                 Electron, inutile pour ces tests).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Un nouveau push sur la même PR annule la vérification devenue obsolète.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest flake8

      - name: flake8
        run: python -m flake8 backend tests launch.py

      - name: pytest
        run: python -m pytest tests -q

  interface:
    name: Interface (ESLint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  bureau:
    name: Application de bureau (tests Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      # Les tests ne lancent pas Electron : inutile de télécharger son binaire.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm test
